# Bundel desktop UJI (unsigned) untuk macOS arm64 dan Windows x64, diunggah
# sebagai artefak run supaya bisa diunduh dari tab Actions.
#
# Ini BUKAN pipeline rilis. Rilis tetap `scripts/release-desktop.sh` dari mesin
# pengembang (docs/22: sertifikat Developer ID, notarization, kunci updater ada
# di sana). Yang dibuat di sini: .dmg/.app (macOS) dan .msi/.exe (Windows)
# dengan tanda tangan ad-hoc / tanpa tanda tangan — cukup untuk menguji fitur
# di mesin lain, tidak untuk dibagikan ke pengguna.
#
# Pemicu: manual (Run workflow) atau tag `v*`. Sengaja bukan tiap push ke main:
# runner macOS + Windows ~20 menit per run dan job `desktop` di ci.yml sudah
# menjaga compile-nya hijau di tiap PR.
name: desktop-artifacts

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: desktop-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Artefak WASM engine (mt + st): langkah yang sama dengan job `wasm` di
  # ci.yml — Vite menanamnya sebagai asset; tanpa itu .app jalan tapi Studio
  # berkata "engine belum dibangun".
  wasm:
    name: wasm (mt + st)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (dari rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: perkakas wasm (wasm-bindgen + binaryen)
        run: ./.github/scripts/install-wasm-tools.sh
      - name: build wasm (mt + st)
        run: ./scripts/build-wasm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: packages/engine/src/wasm/
          retention-days: 3

  desktop:
    name: bundel ${{ matrix.label }}
    needs: [wasm]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
            # ort mengunduh libonnxruntime.a ke sini saat build (P3b, docs/26).
            ort-cache: ~/Library/Caches/ort.pyke.io
            artifact: desktop-macos-arm64
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
            ort-cache: ~\AppData\Local\ort.pyke.io
            artifact: desktop-windows-x64
    runs-on: ${{ matrix.os }}
    # Release build Tauri + ort dari cache dingin: ~10 menit macOS, ~20 menit
    # Windows. Longgar supaya runner Windows yang lambat tidak dihitung gagal.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (dari rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-artifacts-${{ matrix.os }}

      # Binari onnxruntime prebuilt (~80 MB) yang diunduh ort-sys saat compile;
      # bukan bagian target/, jadi rust-cache tidak menyimpannya.
      - uses: actions/cache@v4
        with:
          path: ${{ matrix.ort-cache }}
          key: ort-pyke-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-pyke-${{ matrix.os }}-

      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/engine/src/wasm/

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      - name: Build frontend desktop
        env:
          VITE_ROBLOX_API: ${{ vars.VITE_ROBLOX_API }}
          VITE_LIBRARY_API: ${{ vars.VITE_LIBRARY_API }}
        run: bun run --cwd apps/desktop build

      # `--config tauri.ci.conf.json` mematikan createUpdaterArtifacts (tanpa
      # kunci privat tauri-cli menolak build). tauri-cli lewat npx dengan versi
      # yang sama seperti ci.yml, bukan `cargo install`.
      - name: tauri build (release, bundel)
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.11.4 build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config tauri.ci.conf.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14
          path: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/macos/*.app
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
