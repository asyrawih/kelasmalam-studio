# Rakit dan kirim hasil build ke Vercel. TIDAK membangun apa pun sendiri.
#
# Vercel juga tidak mem-build (`--prebuilt`). Alasannya ada di
# `scripts/vercel-build.sh`: engine butuh Rust nightly + rust-src +
# wasm-bindgen-cli + binaryen, dan `-Z build-std` mengompilasi ulang `std`.
# Build image Vercel tidak punya semua itu.
#
# KENAPA WORKFLOW INI TIDAK PUNYA PEMICUNYA SENDIRI:
# dulu ia dipicu `push: [main]`, pemicu yang sama dengan ci.yml, dan mengulang
# seluruh isi CI — cargo test, build WASM, tsc, vitest — di runner terpisah.
# Dua pipeline, pekerjaan yang sama, ~4 menit runner terbuang tiap commit, dan
# keduanya buta terhadap hasil satu sama lain (CI merah + deploy hijau pernah
# terjadi pada commit yang sama).
#
# Sekarang ia `workflow_call` yang dipanggil ci.yml lewat `needs:`, jadi:
#   - tidak mungkin jalan sebelum native + wasm + web hijau;
#   - artefak yang di-deploy adalah artefak yang BARU SAJA DIUJI, diambil dari
#     run yang sama lewat download-artifact — bukan hasil build ulang yang
#     kebetulan mirip.
# Yang tersisa di sini hanyalah merakit `.vercel/output` dan mengirimnya.
name: deploy

on:
  workflow_call:
    inputs:
      production:
        description: 'Deploy ke produksi (bukan preview)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Deploy tidak boleh saling menyalip: dua build paralel bisa membuat
      # deployment yang lebih lama menimpa yang lebih baru.
      group: deploy-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      # Hanya untuk menjalankan `npx vercel`. Tidak ada `npm ci` di sini —
      # frontend-nya sudah jadi, dependensinya tidak dibutuhkan lagi.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Kedua artefak berasal dari run CI yang sama dengan yang memanggil
      # workflow ini, jadi tidak perlu run-id maupun token lintas-workflow.
      - name: Ambil artefak WASM
        uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/src/wasm/

      - name: Ambil hasil build frontend
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      # SKIP_WASM + SKIP_WEB_BUILD: keduanya sudah ada, diunduh di atas. Yang
      # dikerjakan skrip di sini tinggal gerbang ukuran, verifikasi worklet, dan
      # perakitan .vercel/output — semuanya berjalan atas berkas yang persis
      # akan dikirim.
      - name: Rakit .vercel/output
        env:
          SKIP_WASM: '1'
          SKIP_WEB_BUILD: '1'
        run: ./scripts/vercel-build.sh

      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          PRODUCTION: ${{ inputs.production }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN belum diset — lewati deploy." >&2
            echo "Artefak tetap dirakit dan diverifikasi." >&2
            exit 0
          fi
          PROD=""
          if [ "$PRODUCTION" = "true" ]; then
            PROD="--prod"
          fi
          npx --yes vercel@latest deploy --prebuilt $PROD --token "$VERCEL_TOKEN" --yes

      # Berguna saat deploy dilewati atau gagal: hasil build tetap bisa diunduh
      # dan diperiksa, tanpa harus menjalankan ulang seluruh pipeline.
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output
          path: .vercel/output
          retention-days: 7
