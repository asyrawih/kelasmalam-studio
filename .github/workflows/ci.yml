name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------- native
  native:
    name: native (fmt, clippy, test, bench)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml yang menentukan channel + komponen.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2

      # `daw-native-host` memakai cpal → alsa-sys, yang menautkan pustaka
      # sistem lewat pkg-config. Tanpa ini `cargo test --workspace` gagal di
      # build script alsa-sys, bukan di kode kita.
      - name: pustaka sistem untuk cpal
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # Deteksi alokasi di jalur RT (allocator penjaga, docs/01 §1c).
      - run: cargo test -p daw-engine --features rt-guard

      # Benchmark: simpan baseline PR. Tidak mem-fail build (angka runner
      # CI berisik), tapi outputnya terlihat di log untuk perbandingan.
      - name: bench render
        run: cargo bench -p daw-engine --bench render -- --save-baseline pr
        continue-on-error: true

      # Aturan mengikat docs/00 §1: crate inti tidak boleh menyentuh wasm-bindgen.
      - name: no wasm-bindgen in core crates
        run: |
          set -euo pipefail
          for c in daw-dsp daw-rt daw-timeline daw-engine daw-export; do
            if cargo tree -p "$c" -e normal | grep -q -E 'wasm-bindgen|web-sys|js-sys'; then
              echo "FAIL: $c bergantung pada wasm-bindgen/web-sys/js-sys" >&2
              exit 1
            fi
          done

  # ------------------------------------------------------------------ wasm
  wasm:
    name: wasm (headless test, build, size budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: browser-actions/setup-chrome@v1

      # Toolchain STABIL khusus untuk mem-build perkakas. Perkakas ini tidak
      # ikut ke artefak; ia hanya perlu bisa dikompilasi.
      - run: rustup toolchain install stable --profile minimal

      - name: install tooling
        run: |
          set -euo pipefail
          # `cargo install` TANPA `+stable` memakai toolchain project (nightly
          # yang dipin di rust-toolchain.toml). Dependensi transitif perkakas
          # modern menuntut rustc yang lebih baru, jadi instalasinya gagal
          # dengan pesan yang menunjuk crate asing — bukan masalah kode kita.
          # Versi dibaca dari Cargo.lock, TIDAK ditulis ulang di sini.
          # Sebelumnya angkanya di-hardcode (0.2.95) dan tertinggal jauh dari
          # crate-nya (0.2.127); glue yang dihasilkan lalu tidak cocok dengan
          # section __wbindgen di .wasm, dan wasm-bindgen gagal dengan pesan
          # yang menyuruh menginstal ulang versi yang benar. Satu sumber
          # kebenaran menghapus seluruh kelas kegagalan itu.
          WANT="$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | grep '^version' | head -1 | cut -d'"' -f2)"
          echo "wasm-bindgen dari Cargo.lock: $WANT"
          cargo +stable install wasm-bindgen-cli --version "$WANT" --locked
          sudo apt-get update && sudo apt-get install -y binaryen

      # CATATAN: langkah `wasm-pack test --headless --chrome` DIHAPUS.
      #
      # `crates/wasm-bridge` tidak punya dev-dependency `wasm-bindgen-test` dan
      # tidak punya satu pun tes browser, jadi langkah itu tidak pernah bisa
      # jalan — ia hanya membuat CI merah. Menambahkan tes token sekadar agar
      # langkahnya hijau berarti CI melaporkan cakupan yang tidak ada.
      #
      # Cakupan yang SUNGGUHAN ada sekarang: `web/src/studio/export/
      # wasm-integration.test.ts` memuat artefak `st` yang benar-benar dibangun
      # dan menjalankan render + encode sampai menghasilkan berkas.

      - name: build wasm (mt + st)
        run: ./scripts/build-wasm.sh

      - name: size budget
        run: ./scripts/size-check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: web/src/wasm/
          retention-days: 7

  # ------------------------------------------------------------------- web
  web:
    name: web (test, build)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      # npm, BUKAN pnpm. Satu-satunya lockfile di repo ini adalah
      # `web/package-lock.json`; `pnpm-lock.yaml` tidak pernah ada, jadi
      # `pnpm install --frozen-lockfile` di sini memang tidak pernah bisa
      # jalan. Job deploy sudah memakai npm dan hijau — CI mengikuti jalur
      # yang sama supaya keduanya menguji hal yang sama.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Butuh artefak WASM asli: tes sinkronisasi layout SAB Rust↔TS
      # membaca konstanta dari modul yang benar-benar di-build.
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: web/src/wasm/

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Typecheck + test + build
        working-directory: web
        run: |
          npx tsc --noEmit
          npx vitest run
          npm run build

  # ---------------------------------------------------------------- golden
  golden:
    name: golden (null test bounce == realtime)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      # Tes paling berharga: render project referensi lewat dua jalur
      # (realtime blok-128 vs offline batch) dan bandingkan sample-exact.
      # Null test-nya ada di `crates/engine/src/tests.rs`
      # (`null_test_block_size_invariance_*`), BUKAN di daw-export sebagai
      # target tes terpisah — CI sebelumnya menunjuk target yang tidak pernah
      # ada, jadi job ini selalu merah tanpa pernah menjalankan tesnya.
      - run: cargo test -p daw-engine null_test -- --nocapture
