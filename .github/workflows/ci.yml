name: CI

on:
  push:
    branches: [main]
    # Perubahan yang tidak bisa menjatuhkan build tidak perlu membangunkan
    # empat runner. Catatan: `docs/` TIDAK ikut ke `apps/web/dist`, jadi melewatinya
    # juga berarti tidak ada deploy — itu memang yang diinginkan.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - '.claude/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'design/**'
      - '.claude/**'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy setelah semua tes hijau'
        type: boolean
        default: false
      production:
        description: 'Deploy ke produksi (bukan preview)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Jaringan runner sesekali putus; cargo jangan langsung menyerah.
  CARGO_NET_RETRY: 10
  # Incremental tidak pernah berguna di CI — tiap job mulai dari cache dingin
  # atau cache yang dipulihkan utuh, tidak pernah dari build sebelumnya di mesin
  # yang sama. Yang tersisa hanya ongkosnya: berkas .fingerprint yang membesar
  # dan memperlambat simpan/pulih cache.
  CARGO_INCREMENTAL: 0
  # Debug info penuh untuk tes = target dir berlipat ukurannya, dan cache
  # rust-cache ikut membengkak (langkah pulih cache sendiri makan ~18 detik).
  # `line-tables-only` tetap memberi berkas:baris di backtrace — yang benar-benar
  # dibaca orang saat tes gagal — tanpa tabel variabel DWARF yang tidak pernah
  # dipakai tanpa debugger.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # ---------------------------------------------------------------- native
  native:
    name: native (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # `rust-toolchain.toml` adalah SATU-SATUNYA sumber versi toolchain.
      #
      # Sebelumnya di sini ada `dtolnay/rust-toolchain@nightly`, dan logya
      # sendiri mengaku sia-sia:
      #
      #   nightly-x86_64-unknown-linux-gnu installed - rustc 1.100.0-nightly
      #   info: note that the toolchain 'nightly-2025-06-15-x86_64-unknown-linux-gnu'
      #         is currently in use (overridden by '.../rust-toolchain.toml')
      #
      # Sepuluh detik dipakai mengunduh toolchain yang lalu tidak dipakai satu
      # perintah pun, dan toolchain yang SUNGGUHAN dipakai baru diunduh diam-diam
      # saat cargo pertama kali jalan. `rustup toolchain install` tanpa argumen
      # membaca berkas itu langsung: satu toolchain, sekali unduh.
      - name: Rust toolchain (dari rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # `daw-native-host` DIKECUALIKAN di sini dan diuji di job `native-host`
      # tersendiri. Ia satu-satunya crate yang menyeret pustaka sistem
      # (cpal → alsa-sys → pkg-config → libasound2-dev), dan memasangnya berarti
      # menaruh apt di jalur kritis.
      #
      # apt di runner GitHub terbukti bisa berhenti merespons tanpa batas waktu
      # (run 32296099238: menggantung 45 menit; run 32301316989: `apt-get update`
      # macet 180 detik penuh tiga kali berturut-turut). Selama langkah itu ada
      # di job ini, satu mirror Ubuntu yang sedang ngambek cukup untuk membuat
      # fmt, clippy, test, null test, DAN deploy tidak pernah jalan sama sekali
      # — padahal tidak satu pun dari semuanya membutuhkan ALSA.
      #
      # Cakupannya tidak berkurang: yang dikecualikan di sini diuji utuh di job
      # sebelah. Yang berubah hanya siapa yang ikut mati saat apt bermasalah.
      #
      # `daw-desktop` (Tauri, docs/20 §1e) dikecualikan dengan alasan yang sama
      # dalam bentuk yang lebih parah: di Linux crate Tauri menyeret webkit2gtk,
      # libsoup, dan gtk lewat apt — dan Linux memang bukan target desktop.
      # Ia diuji di job `desktop` di runner macOS + Windows, tempat WebView-nya
      # sudah ada di OS. `cargo fmt` tetap menyentuhnya: fmt tidak mengompilasi.
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude daw-native-host --exclude daw-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude daw-native-host --exclude daw-desktop

      # Deteksi alokasi di jalur RT (allocator penjaga, docs/01 §1c).
      - run: cargo test -p daw-engine --features rt-guard

      # Tes paling berharga: render project referensi lewat dua jalur (realtime
      # blok-128 vs offline batch) dan bandingkan sample-exact.
      #
      # Dulu ini job `golden` tersendiri. Isinya adalah HIMPUNAN BAGIAN dari
      # `cargo test --workspace` di atas — null test-nya ada di
      # `crates/engine/src/tests.rs`, jadi baris ini sudah ikut jalan beberapa
      # langkah yang lalu. Satu runner penuh plus pulih-cache ~26 detik dipakai
      # untuk menjalankan ulang tes yang sudah hijau. Yang benar-benar
      # ditambahkan job itu cuma `--nocapture`, dan itu satu langkah 2 detik.
      - name: golden — null test (bounce == realtime)
        run: cargo test -p daw-engine null_test -- --nocapture

      # Aturan mengikat docs/00 §1: crate inti tidak boleh menyentuh wasm-bindgen.
      - name: no wasm-bindgen in core crates
        run: |
          set -euo pipefail
          for c in daw-dsp daw-rt daw-timeline daw-engine daw-export; do
            if cargo tree -p "$c" -e normal | grep -q -E 'wasm-bindgen|web-sys|js-sys'; then
              echo "FAIL: $c bergantung pada wasm-bindgen/web-sys/js-sys" >&2
              exit 1
            fi
          done

      # Benchmark TIDAK jalan di pull request. Ia tidak mem-fail build (angka
      # runner CI berisik), baselinenya dibuang bersama runner, dan tidak ada
      # yang membaca 30 detik log itu di tiap PR. Di push ke main ia tetap ada
      # sebagai catatan historis yang bisa dibandingkan antar-commit.
      - name: bench render
        if: github.event_name != 'pull_request'
        run: cargo bench -p daw-engine --bench render -- --save-baseline main
        continue-on-error: true

  # ----------------------------------------------------------- native-host
  # Satu-satunya job yang butuh pustaka sistem, jadi satu-satunya job yang bisa
  # dijatuhkan oleh apt.
  #
  # `daw-native-host` adalah binari debugging desktop (cpal → alsa-sys) yang
  # tidak pernah ikut ke build web — deploy memang sudah tidak pernah
  # mengujinya. Karena itu ia SENGAJA tidak masuk `needs:` job deploy: mirror
  # Ubuntu yang sedang bermasalah tidak boleh menghalangi pengiriman kode yang
  # tidak memakainya. Kegagalannya tetap terlihat merah di run — hanya saja
  # tidak lagi menyandera hal lain.
  native-host:
    name: native-host (clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (dari rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Lewat pembungkus, BUKAN `apt-get` langsung — lihat
      # .github/scripts/apt-install.sh soal kenapa `apt-get update` dihindari
      # selama masih bisa.
      - name: pustaka sistem untuk cpal
        run: ./.github/scripts/apt-install.sh libasound2-dev pkg-config

      - run: cargo clippy -p daw-native-host --all-targets -- -D warnings
      - run: cargo test -p daw-native-host

  # ------------------------------------------------------------------ wasm
  wasm:
    name: wasm (build, size budget)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml sudah mendaftarkan target wasm32-unknown-unknown
      # dan komponen rust-src, jadi tidak ada yang perlu ditambahkan di sini.
      - name: Rust toolchain (dari rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # CATATAN: `browser-actions/setup-chrome` DIHAPUS bersama langkah
      # `wasm-pack test --headless --chrome` yang sudah lebih dulu dihapus.
      # `crates/wasm-bridge` tidak punya satu pun tes browser, jadi Chrome
      # dipasang 11 detik di tiap run untuk sesuatu yang tidak pernah dijalankan.
      # Cakupan yang SUNGGUHAN ada: `apps/web/src/studio/export/wasm-integration.test.ts`
      # di job `web`, yang memuat artefak `st` hasil build ini.

      # Binari siap pakai, bukan `cargo install` (61 detik) + `apt-get` (76 detik,
      # atau menggantung selamanya). Lihat .github/scripts/install-wasm-tools.sh.
      - name: perkakas wasm (wasm-bindgen + binaryen)
        run: ./.github/scripts/install-wasm-tools.sh

      - name: build wasm (mt + st)
        run: ./scripts/build-wasm.sh

      - name: size budget
        run: ./scripts/size-check.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: packages/engine/src/wasm/
          retention-days: 7

  # ------------------------------------------------------------------- web
  web:
    name: web (test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: wasm
    steps:
      # bun, BUKAN npm/pnpm. Satu workspace, satu lockfile: `bun.lock` di root
      # (docs/25 §1a). Versi bun dipin sama dengan `packageManager` di
      # package.json root supaya lockfile dibaca format yang sama.
      #
      # Node tetap dipasang: `bun run` menghormati shebang `#!/usr/bin/env node`
      # pada biner vitest/vite/tsc, jadi tes dan build berjalan di Node yang
      # sama dengan yang dipakai sebelum migrasi — bun di sini hanya pengelola
      # paket dan pelari skrip.
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Butuh artefak WASM asli: tes sinkronisasi layout SAB Rust↔TS
      # membaca konstanta dari modul yang benar-benar di-build.
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/engine/src/wasm/

      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run --cwd apps/web test

      # `bun run build` = `tsc --noEmit && vite build`. Sebelumnya ada
      # `npx tsc --noEmit` terpisah tepat di atas baris ini, jadi seluruh
      # typecheck jalan DUA KALI tiap run — satu-satunya bedanya, yang kedua
      # dijalankan lewat npm.
      # Alamat backend ditanam Vite SAAT BUILD, dan build-nya terjadi DI SINI —
      # bukan di Vercel. Mengisinya di dashboard Vercel tidak berpengaruh apa
      # pun: yang dikirim ke sana adalah hasil build yang sudah jadi
      # (`vercel deploy --prebuilt`), dan variabel yang datang belakangan tidak
      # bisa masuk ke berkas yang sudah ditulis.
      #
      # Repository *variables* (bukan secrets): keduanya URL publik yang muncul
      # di setiap permintaan browser. Yang belum diisi jadi string kosong, dan
      # aplikasi menanganinya dengan jujur — halaman /roblox berkata UI ONLY,
      # dok kepustakaan berkata BELUM DIPASANG.
      - name: Typecheck + build
        env:
          VITE_ROBLOX_API: ${{ vars.VITE_ROBLOX_API }}
          VITE_LIBRARY_API: ${{ vars.VITE_LIBRARY_API }}
        run: bun run --cwd apps/web build

      # Hasil build dipakai apa adanya oleh job deploy. Membangunnya ulang di
      # sana berarti menjalankan tsc + vite untuk kedua kalinya atas commit yang
      # sama — dan, lebih buruk, mengirim ke produksi berkas yang BUKAN berkas
      # yang baru saja diuji.
      #
      # Sejak docs/25 P2 job `desktop` TIDAK lagi memakai artefak ini — ia
      # membangun frontend-nya sendiri (`apps/desktop`). Artefak ini hanya
      # untuk deploy, tapi tetap diunggah di tiap run supaya `workflow_dispatch`
      # dengan `deploy: true` punya sesuatu untuk dikirim; ~60 MB per run,
      # dibuang setelah sehari.
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 1

  # --------------------------------------------------------------- backend
  # Worker unggah Roblox. Berdiri sendiri: tidak butuh artefak WASM dan tidak
  # butuh `web`, jadi ia berjalan berbarengan dengan job lain alih-alih
  # mengantre di belakangnya.
  #
  # Yang paling penting dijalankan di sini adalah `src/roblox/limits.test.ts`:
  # ia meng-import model UI dan menuntut batas server sama persis. Tanpa job
  # ini, penjaga itu cuma jalan di mesin orang yang kebetulan menjalankannya.
  #
  # `wrangler` sengaja TIDAK ada di devDependencies — ia menarik workerd dan
  # sharp (puluhan MB) untuk sesuatu yang hanya dipakai saat dev/deploy, bukan
  # saat tes. Script `dev`/`deploy` memanggilnya lewat npx dengan versi terpin.
  backend:
    name: backend (test, typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Node 24, BUKAN 22 seperti job web: tes kepustakaan menjalankan SQL-nya
      # di atas `node:sqlite` sungguhan, dan modul itu masih di balik flag di
      # 22.x. Menurunkannya berarti seluruh lapisan SQL tidak teruji.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # `backend` adalah anggota workspace yang sama (docs/25 §1a); instalnya
      # dari root, satu lockfile.
      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run --cwd backend test

      # Dua tsconfig: kode Worker dinilai TANPA tipe Node (supaya `Buffer` dan
      # `process` tidak diam-diam lolos ke produksi), harness tes dengan.
      - name: Typecheck
        run: bun run --cwd backend typecheck

  # --------------------------------------------------------------- desktop
  # Aplikasi desktop Tauri (docs/20 §3, docs/25 P2). Dua runner, dua WebView:
  # WKWebView di macOS dan WebView2 di Windows. Yang dibuktikan di sini: frontend
  # desktop (`apps/desktop`, aplikasi Vite sendiri) terbangun, crate-nya
  # mengompilasi, link dengan toolchain OS masing-masing (MSVC di Windows),
  # aset ditanam (`frontendDist: ../dist`), dan tes unit menu + server loopback
  # lewat — BUKAN bahwa suara keluar. Itu tetap butuh mesin sungguhan
  # (docs/20 §5b).
  #
  # `needs: [wasm]` saja — bukan `web` lagi. Dulu job ini menanam artefak
  # `web-dist` karena desktop memakai bundel web yang sama; sejak docs/25 P2
  # desktop punya frontend sendiri, jadi ia membangunnya di sini dari artefak
  # `wasm` (engine mt/st yang ditanam Vite sebagai asset) dan tidak menunggu
  # job `web`. Job `web` dan `deploy` tidak menyentuh desktop sama sekali.
  #
  # Job ini SENGAJA tidak ada di `needs:` job deploy: runner macOS/Windows
  # lebih lambat dan lebih jarang tersedia daripada Ubuntu, dan kegagalan
  # bundel desktop tidak boleh menahan web yang tidak memakainya. Merah di
  # sini tetap terlihat di run — hanya tidak menyandera.
  desktop:
    name: desktop (${{ matrix.os }})
    needs: [wasm]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Compile Tauri dari cache dingin ~6 menit di macOS dan ~12 menit di
    # Windows; dua kali (clippy + build) plus tes. Longgar, supaya runner
    # Windows yang sedang lambat tidak dihitung sebagai gagal.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (dari rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          # Cache dipisah per OS dan per crate: target Tauri tidak berbagi apa
          # pun dengan target job `native`, dan menimpanya hanya bikin keduanya
          # saling membuang cache.
          key: desktop-${{ matrix.os }}

      # Artefak WASM: Vite menerbitkan `engine_bg.wasm` mt/st sebagai asset
      # ber-hash ke `apps/desktop/dist`, dan tanpa itu `vite build` tetap hijau
      # sementara Studio di .app jatuh ke "engine belum dibangun".
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: packages/engine/src/wasm/

      # bun + Node, alasan yang sama dengan job `web` (bun = pengelola paket dan
      # pelari skrip; vite/tsc berjalan di Node). tauri-cli lewat npx, BUKAN
      # `cargo install tauri-cli` — yang terakhir mengompilasi CLI-nya dari
      # source (~5 menit per runner) untuk binary yang sudah tersedia jadi di
      # npm. Versinya dipin sama dengan mesin pengembang supaya
      # `tauri.conf.json` dibaca skema yang sama.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps (workspace)
        run: bun install --frozen-lockfile

      # Frontend desktop: `tsc --noEmit && vite build` → `apps/desktop/dist`.
      # Env `VITE_*` sama dengan job web — alamat backend ditanam saat build,
      # dan kosong berarti halaman yang bergantung padanya berkata "belum
      # dipasang", bukan galat.
      - name: Build frontend desktop
        env:
          VITE_ROBLOX_API: ${{ vars.VITE_ROBLOX_API }}
          VITE_LIBRARY_API: ${{ vars.VITE_LIBRARY_API }}
        run: bun run --cwd apps/desktop build

      - run: cargo clippy -p daw-desktop --all-targets -- -D warnings

      # `--no-bundle`: yang diuji adalah compile + link + penanaman aset, bukan
      # .dmg/.msi — bundling adalah urusan `scripts/release-desktop.sh` (docs/22)
      # dan butuh sertifikat yang tidak ada di PR.
      - name: tauri build (debug, tanpa bundel)
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@2.11.4 build --debug --no-bundle

      - run: cargo test -p daw-desktop

  # ---------------------------------------------------------------- deploy
  # Deploy adalah KELANJUTAN dari CI, bukan pipeline kedua yang berlomba
  # dengannya.
  #
  # Sebelumnya `deploy.yml` berjalan sendiri dengan pemicu `push: [main]` yang
  # sama, jadi tiap push ke main menjalankan dua pipeline yang mengulang
  # pekerjaan yang persis sama: cargo test, build WASM, tsc, vitest, plus
  # pemasangan toolchain dan binaryen-nya sendiri. Empat menit runner terbuang
  # tiap commit.
  #
  # Dan keduanya tidak saling melihat. Pada run 32197356174 (18 Agt 2026) CI
  # MERAH dan deploy HIJAU pada commit yang sama — kode yang gagal CI tetap naik
  # ke produksi, karena satu-satunya gerbang deploy adalah tesnya sendiri yang
  # lebih longgar (`--exclude daw-native-host`, tanpa clippy, tanpa null test).
  # `needs:` di bawah membuat keadaan itu tidak mungkin terulang.
  deploy:
    needs: [native, wasm, web, backend]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    uses: ./.github/workflows/deploy.yml
    with:
      production: ${{ github.event_name == 'push' || inputs.production }}
    secrets: inherit
