[workspace]
resolver = "2"
members = [
    "crates/dsp",
    "crates/rt",
    "crates/timeline-core",
    "crates/analysis",
    "crates/engine",
    "crates/export",
    "crates/wasm-bridge",
    "crates/native-host",
    # Desktop (docs/20). Keduanya native; `daw-desktop` menyeret Tauri dan
    # dikecualikan dari job CI Ubuntu seperti native-host.
    "crates/desktop-host",
    "desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
license = "MIT OR Apache-2.0"
publish = false

# Dependensi bersama: versi ditentukan SEKALI di sini, tiap crate memakai
# `{ workspace = true }`. Ini mencegah dua versi crate yang sama masuk ke
# binary WASM (ukuran membengkak) dan bikin bump versi jadi satu baris.
[workspace.dependencies]
# --- crate internal (path) ---
daw-dsp      = { path = "crates/dsp" }
daw-rt       = { path = "crates/rt" }
daw-timeline = { path = "crates/timeline-core" }
daw-analysis = { path = "crates/analysis" }
daw-engine   = { path = "crates/engine" }
daw-export   = { path = "crates/export" }

# --- pihak ketiga ---
# serde: hanya dipakai di jalur non-RT (model project, snapshot).
serde        = { version = "1", default-features = false, features = ["derive", "alloc"] }
# postcard dipilih daripada serde_json di jalur WASM: tanpa std::fmt, jauh lebih kecil.
postcard     = { version = "1", default-features = false, features = ["alloc"] }
# WAV writer untuk crate export.
hound        = "3.5"
# Encoder FLAC pure-Rust. `default-features = false` WAJIB: fitur default-nya
# menyalakan `par` (rayon) dan `simd-nightly`, yang keduanya tidak ada di
# wasm32-unknown-unknown. Tanpa itu build wasm gagal linking.
flacenc      = { version = "0.5", default-features = false }
# libm: `core` tidak punya sin/cos. Dipakai crate no_std (dsp, engine).
libm         = { version = "0.2", default-features = false }
# serde_json HANYA di crates/wasm-bridge: JSON adalah bahasa yang bisa dibicarakan
# TypeScript; postcard tidak. Lihat `wasm-bridge/src/studio.rs`.
serde_json   = { version = "1", default-features = false, features = ["alloc"] }
# Bridge WASM — HANYA boleh dipakai crates/wasm-bridge.
wasm-bindgen = "0.2"
js-sys       = "0.3"
web-sys      = "0.3"
console_error_panic_hook = "0.1"
# Host native dev-only.
cpal         = "0.15"
anyhow       = "1"
# --- desktop-host (docs/20 §1g) — HANYA crates/desktop-host ---
# HTTP untuk unduh model dan unggah ke Roblox Open Cloud (docs/21 §1e).
# Tanpa fitur default: tanpa http2, tanpa proxy sistem, dan TLS lewat rustls
# (aws-lc-rs, prebuilt-nasm) — tidak ada OpenSSL. `multipart` dibutuhkan
# `open_cloud.rs` (bagian `request` + `fileContent`). Fitur `stream` sengaja
# tidak dinyalakan: `Response::chunk()` sudah streaming tanpa menyeret
# tokio-util, dan `Body::wrap_stream` toh tidak bisa dipakai tanpa
# `futures-core` sebagai dependensi langsung.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "multipart"] }
tokio   = { version = "1", default-features = false, features = ["fs", "io-util"] }
sha2    = "0.11"
# Penyimpanan lokal desktop (docs/21 §1a). `bundled`: SQLite dikompilasi ikut
# crate, bukan dicari di sistem — di Windows tidak ada libsqlite3, dan di macOS
# versi bawaan OS terlalu tua untuk `RETURNING`/`UPSERT` yang dipakai skema.
rusqlite = { version = "0.40", features = ["bundled"] }
# Baca header audio saat impor (frames + sample rate) — hanya probe, tanpa
# decode. Fitur dipilih satu per satu: bawaan `symphonia` menyeret semua codec
# royalti-bebas, dan yang dipakai kepustakaan hanya empat kontainer ini.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "flac", "pcm"] }
# Ruang disk tersisa sebelum menyalin berkas ke `tracks/` (DISK_FULL sebelum
# menulis, bukan sesudah ENOSPC di tengah). Pure Rust (rustix/windows-sys).
fs4 = { version = "1", default-features = false }
uuid = { version = "1", features = ["v4"] }
# Keyring generasi baru: `keyring` 4.x sendiri hanya facade; fitur `v1`-nya
# memaksa zbus/Secret Service di Linux, dan tanpa `v1` ia compile_error. Maka
# kita mengikuti anjuran README-nya: link `keyring-core` + store per-OS yang
# dipilih sendiri. Store Linux sengaja TIDAK ada (target rilis hanya macOS +
# Windows; job CI Ubuntu tetap harus mengompilasi tanpa dbus).
keyring-core                 = "1"
apple-native-keyring-store   = { version = "1", features = ["keychain"] }
# `search` (default) menyeret regex; kita hanya get/set/delete.
windows-native-keyring-store = { version = "1", default-features = false }
# Discovery SoundCloud in-process untuk desktop (crates/desktop-host/src/soundcloud.rs):
# pustaka yang SAMA dengan yang menjalankan soundcloud.kelasmalam.app, di-pin ke
# revisi supaya build bisa diulang. Menarik reqwest 0.12 di samping 0.13 —
# dua salinan reqwest di binari desktop, diterima sampai soundclaude naik versi.
soundclaude  = { git = "https://github.com/asyrawih/soundclaude", rev = "a5c3aa6005c42ad02377cf6ccb752a6e0d7560eb" }
# Dev/test.
criterion    = "0.5"
proptest     = "1"
tempfile     = "3"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = true

# Dependensi pun dioptimasi penuh — tidak ada yang boleh jadi rem di hot loop.
[profile.release.package."*"]
opt-level = 3

# Benchmark & test butuh unwinding (criterion/proptest memakai catch_unwind),
# jadi profil bench TIDAK memakai panic = "abort".
[profile.bench]
opt-level     = 3
lto           = "thin"
codegen-units = 1
debug         = true

# Iterasi dev lebih enak kalau DSP tidak berjalan 50x lebih lambat.
[profile.dev.package."*"]
opt-level = 2
