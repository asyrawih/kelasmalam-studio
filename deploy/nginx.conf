# nginx untuk DawOnWeb (produksi, static hosting hasil `pnpm build`).
# Inti: SharedArrayBuffer hanya hidup kalau crossOriginIsolated === true,
# yang butuh COOP + COEP di dokumen utama. Lihat docs/01-threads-memory.md §1d.

server {
    listen              80;
    listen              [::]:80;
    server_name         _;
    root                /var/www/dawonweb;   # isi = web/dist
    index               index.html;

    # --- Cross-origin isolation ------------------------------------------
    # Tanpa ketiga header ini, aplikasi tetap jalan tapi masuk degraded mode
    # (tanpa SAB): command lewat postMessage, export single-thread.
    # `always` penting supaya header ikut terkirim pada respons error (4xx/5xx).
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;

    # Hardening ringan.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "same-origin" always;

    # --- MIME ------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;
    # Nginx lama belum punya entri wasm. `types {}` di sini menambah, bukan
    # mengganti, daftar dari mime.types.
    types {
        application/wasm  wasm;
    }

    # --- Kompresi ---------------------------------------------------------
    # .wasm sangat kompresibel (~3-4x). gzip_static dipakai kalau build
    # menghasilkan .gz di samping file aslinya.
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        application/wasm
                      application/javascript
                      text/javascript
                      application/json
                      text/css
                      image/svg+xml;
    gzip_static       on;

    # --- Caching ----------------------------------------------------------
    # Aset ber-hash dari Vite: immutable, cache selamanya.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # add_header di level location MENGGANTI yang di level server,
        # jadi header isolasi harus diulang.
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    location ~* \.wasm$ {
        default_type application/wasm;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    # index.html tidak boleh di-cache: dia yang menunjuk ke aset ber-hash.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
