# Worker KEPUSTAKAAN — docs/16.
#
# Deploy TERPISAH dari Worker Roblox dengan sengaja: umur datanya berbeda
# (yang satu tidak menyimpan apa pun, yang ini memegang seluruh kepustakaan
# user), dan satu deploy yang salah tidak boleh menjatuhkan dua-duanya.
#
#   npx wrangler deploy --config wrangler.library.toml

name = "dawonweb-library"
main = "src/library/worker.ts"
compatibility_date = "2026-08-20"

# Domain ditulis DI SINI, bukan dipasang lewat dashboard: yang di dashboard
# hilang dari pandangan orang berikutnya yang men-deploy dari mesin lain.
# Lihat docs/18 §3.6.
# routes = [{ pattern = "api.contoh.com", custom_domain = true }]
routes = [{ pattern = "lib.kelasmalam.app", custom_domain = true }]

[vars]
# HARUS subdomain dari domain yang sama dengan APP_ORIGIN — docs/16 §5b.
# Kalau beda registrable domain, cookie sesi terpaksa SameSite=None, yaitu
# cookie pihak ketiga: sudah diblokir Safari dan sedang dimatikan Chrome.
# Rusaknya senyap — jalan di Chrome hari ini, mati di Safari.
APP_ORIGIN = "https://studio.kelasmalam.app"
API_ORIGIN = "https://lib.kelasmalam.app"



# Kosongkan untuk memakai APP_ORIGIN saja. Dikosongkan berarti DIKOSONGKAN:
# Worker memperlakukan string kosong sama dengan tidak diisi (lihat worker.ts).
ALLOWED_ORIGINS = ""

GOOGLE_CLIENT_ID = "481640866366-qpgi7prr1bqp7sshhbf0599ls4f0qoo6.apps.googleusercontent.com"

R2_ACCOUNT_ID = "50e581e2e656a57101931cd40913d8cc"
R2_BUCKET = "pustaka"

# Batas satu berkas. Di atas ini butuh multipart S3 yang belum ada (§5c) —
# `/tracks/init` menolaknya SEBELUM ada byte yang naik.
MAX_TRACK_BYTES = "104857600"

# Kuota total per user. Kosong = tanpa batas (§8f). Satu user dengan seratus
# lagu WAV bisa menghabiskan tier gratis R2 sendirian.
MAX_USER_BYTES = "" # 500mb aja nant

SESSION_TTL_DAYS = "30"

# Rahasia — JANGAN ditulis di sini. Pasang lewat:
#   npx wrangler secret put GOOGLE_CLIENT_SECRET  --config wrangler.library.toml
#   npx wrangler secret put R2_ACCESS_KEY_ID      --config wrangler.library.toml
#   npx wrangler secret put R2_SECRET_ACCESS_KEY  --config wrangler.library.toml

[[d1_databases]]
# `DB`, bukan nama databasenya. Dashboard Cloudflare menyarankan nama yang
# mengikuti nama D1-nya, dan itu MENYESATKAN: yang harus cocok adalah nama
# binding di sini dengan `env.DB` di kode. Salah nama tidak membuat deploy
# gagal — ia membuat `env.DB` undefined, dan meledak baru saat ada permintaan
# yang menyentuh database.
binding = "DB"
database_name = "dawonweb-library"
database_id = "b3bc8f21-76cb-4b45-b5ec-247eb14ae523"
migrations_dir = "migrations"

# Binding R2 dipakai untuk MEMBACA saja (head + get). Upload tidak lewat sini:
# ia langsung ke R2 dengan presigned PUT, dan itulah kenapa kredensial S3 di
# atas tetap dibutuhkan meski binding ini ada. Alasannya di src/library/presign.ts.
[[r2_buckets]]
binding = "TRACKS"
bucket_name = "pustaka"
