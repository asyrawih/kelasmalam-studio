[package]
name = "daw-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Engine adalah crate `no_std`-compatible: ia hidup di dalam AudioWorklet dan
# tidak boleh menyentuh apa pun selain `core` + `alloc` (alokasi HANYA di
# Engine::new / from_snapshot, tidak pernah di jalur render).
[dependencies]
daw-dsp = { workspace = true }
daw-rt = { workspace = true }
daw-timeline = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[features]
default = []
# Meneruskan penjaga alokasi daw-rt ke tes: render_block wajib zero-alloc.
rt-guard = ["daw-rt/rt-guard"]

[[bench]]
name = "render"
harness = false
