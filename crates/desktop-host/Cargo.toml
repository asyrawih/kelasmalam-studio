[package]
name = "daw-desktop-host"
description = "Sisi Rust aplikasi desktop yang TIDAK bergantung pada Tauri: unduh, verifikasi & baca model ONNX. Dipanggil oleh crate daw-desktop sebagai command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
reqwest = { workspace = true }
tokio   = { workspace = true }
sha2    = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
