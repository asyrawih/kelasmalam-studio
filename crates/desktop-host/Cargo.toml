[package]
name = "daw-desktop-host"
description = "Sisi Rust aplikasi desktop yang TIDAK bergantung pada Tauri: kepustakaan lokal (SQLite + tracks/), antrean & katalog Roblox, rahasia di keychain OS, unduh & baca model ONNX. Dipanggil oleh crate daw-desktop sebagai command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[dependencies]
soundclaude  = { workspace = true }
reqwest      = { workspace = true }
# `process`: yt-dlp dijalankan sebagai subprocess async (src/youtube.rs).
tokio        = { workspace = true, features = ["process"] }
sha2         = { workspace = true }
rusqlite     = { workspace = true }
symphonia    = { workspace = true }
fs4          = { workspace = true }
uuid         = { workspace = true }
# Fitur `std` dinyalakan di sini: versi workspace-nya no_std-oriented (untuk
# crate WASM), sedangkan ini crate native yang payload IPC-nya memang `String`.
serde        = { workspace = true, features = ["std"] }
serde_json   = { workspace = true, features = ["std"] }

# Vocal split native (docs/26 P3b, `src/vocal_split.rs`): ONNX Runtime +
# FFT. `download-binaries` mengunduh binari ORT prebuilt saat build pertama
# (temuan static/dynamic ada di kepala modul). `ndarray` tidak dibutuhkan:
# tensor dibuat dari `(shape, Vec<f32>)`.
ort          = { workspace = true, features = ["std", "download-binaries", "tls-rustls", "api-27"] }
rustfft      = { workspace = true }

# EP CoreML hanya di macOS: fitur `coreml` ort-sys menautkan framework
# CoreML/Foundation yang tidak ada di Windows.
[target.'cfg(target_os = "macos")'.dependencies]
ort          = { workspace = true, features = ["coreml"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
